name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（规范语义版本，例如 v0.1.0）'
        required: true
        type: string
      commit:
        description: '固定源码 40 位小写 commit SHA（留空则使用当前 ref 的 HEAD）'
        required: false
        type: string
        default: ''
      publish:
        description: '是否创建 GitHub Release（关闭时仅构建并上传 Actions Artifact）'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build 5-platform candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      publish: ${{ steps.meta.outputs.publish }}
      tag_exists: ${{ steps.meta.outputs.tag_exists }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      supported_apis: ${{ steps.meta.outputs.supported_apis }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release inputs
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            PUBLISH="$INPUT_PUBLISH"
          else
            VERSION="$REF_NAME"
            PUBLISH="true"
          fi

          # 与 scripts/build-release.py 保持一致，仅接受规范 vX.Y.Z 版本。
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid version format (expected vX.Y.Z): ${VERSION}" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_COMMIT" ]; then
            if ! [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid commit SHA (expected 40 lowercase hex chars)." >&2
              exit 1
            fi
            if ! git cat-file -e "${INPUT_COMMIT}^{commit}" 2>/dev/null; then
              echo "Specified commit not found in repository history." >&2
              exit 1
            fi
            git checkout --detach "$INPUT_COMMIT"
          fi

          COMMIT="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            TAG_COMMIT="$(git rev-parse "refs/tags/${VERSION}^{commit}")"
            if [ "$TAG_COMMIT" != "$COMMIT" ]; then
              echo "Existing tag ${VERSION} points to ${TAG_COMMIT}, not ${COMMIT}." >&2
              exit 1
            fi
            TAG_EXISTS="true"
          else
            TAG_EXISTS="false"
          fi

          # 禁止覆盖已发布版本，提前拦截避免无效构建。
          if [ "$PUBLISH" = "true" ]; then
            if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release ${VERSION} already exists; overwriting published versions is forbidden." >&2
              exit 1
            fi
          fi

          # 读取固定 commit 下的 supported-apis.json，用于发布后通知平台同步客户端版本关联。
          SUPPORTED_APIS="$(python3 - "$COMMIT" <<'PY'
          import json
          import re
          import subprocess
          import sys

          commit = sys.argv[1]
          raw = subprocess.check_output(["git", "show", f"{commit}:supported-apis.json"], text=True)
          items = json.loads(raw)
          assert isinstance(items, list) and len(items) > 0, "supported-apis.json must be a non-empty JSON array"
          seen = set()
          for item in items:
              assert isinstance(item, dict) and set(item.keys()) == {"product", "api_major"}
              assert isinstance(item["product"], str) and re.fullmatch(r"[a-z][a-z0-9]*(?:-[a-z0-9]+)*", item["product"])
              assert isinstance(item["api_major"], str) and re.fullmatch(r"v[1-9][0-9]*", item["api_major"])
              assert item["product"] not in seen
              seen.add(item["product"])
          print(json.dumps(items, separators=(",", ":")))
          PY
          )"

          CANDIDATE_DIR="${RUNNER_TEMP}/antapi-release-${VERSION}"
          ARTIFACT_NAME="antapi-${VERSION}-${COMMIT}"

          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "publish=${PUBLISH}"
            echo "tag_exists=${TAG_EXISTS}"
            echo "candidate_dir=${CANDIDATE_DIR}"
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "supported_apis=${SUPPORTED_APIS}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify repository before building
        run: make verify

      - name: Build 5-platform release candidate
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          CANDIDATE_DIR: ${{ steps.meta.outputs.candidate_dir }}
        run: |
          set -euo pipefail
          bash scripts/build-release.sh "$VERSION" "$COMMIT" "$CANDIDATE_DIR"
          # 再次运行以核验既有候选目录的摘要与清单一致性。
          bash scripts/build-release.sh "$VERSION" "$COMMIT" "$CANDIDATE_DIR"

      - name: Verify checksums and smoke-test linux/amd64 binary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          CANDIDATE_DIR: ${{ steps.meta.outputs.candidate_dir }}
        run: |
          set -euo pipefail
          (cd "$CANDIDATE_DIR" && sha256sum -c SHA256SUMS)

          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          tar -xzf "${CANDIDATE_DIR}/antapi_${VERSION}_linux_amd64.tar.gz" -C "$SMOKE_DIR"
          VERSION_JSON="$("${SMOKE_DIR}/antapi" version --json)"

          VERSION_JSON="$VERSION_JSON" python3 - "$CANDIDATE_DIR" "$VERSION" "$COMMIT" <<'PY'
          import json
          import os
          import pathlib
          import sys

          candidate_dir, expected_version, expected_commit = sys.argv[1:4]
          manifest = json.loads((pathlib.Path(candidate_dir) / "manifest.json").read_text())
          output = json.loads(os.environ["VERSION_JSON"])
          expected = {
              "version": expected_version,
              "commit": expected_commit,
              "built_at": manifest.get("built_at"),
          }
          assert output == expected, f"version output mismatch: {output} != {expected}"
          PY

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ steps.meta.outputs.candidate_dir }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-candidate

      - name: Re-verify downloaded candidate integrity
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
        run: |
          set -euo pipefail
          (cd "$CANDIDATE_DIR" && sha256sum -c SHA256SUMS)

          python3 - "$CANDIDATE_DIR" "$VERSION" "$COMMIT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          candidate = pathlib.Path(sys.argv[1])
          version, commit = sys.argv[2], sys.argv[3]
          targets = [
              ("darwin", "amd64"),
              ("darwin", "arm64"),
              ("linux", "amd64"),
              ("linux", "arm64"),
              ("windows", "amd64"),
          ]
          expected_names = [
              f"antapi_{version}_{os_name}_{arch}." + ("zip" if os_name == "windows" else "tar.gz")
              for os_name, arch in targets
          ]
          actual_files = {p.name for p in candidate.iterdir()}
          expected_files = set(expected_names + ["SHA256SUMS", "manifest.json"])
          assert actual_files == expected_files, f"unexpected file set: {actual_files}"

          manifest = json.loads((candidate / "manifest.json").read_text())
          assert manifest.get("schema_version") == 1
          assert manifest.get("version") == version
          assert manifest.get("commit") == commit

          expected_artifacts = [
              {
                  "name": name,
                  "sha256": hashlib.sha256((candidate / name).read_bytes()).hexdigest(),
                  "os": os_name,
                  "arch": arch,
              }
              for (os_name, arch), name in zip(targets, expected_names)
          ]
          assert manifest.get("artifacts") == expected_artifacts, "manifest artifacts mismatch"

          expected_sums = "".join(f"{item['sha256']}  {item['name']}\n" for item in expected_artifacts)
          assert (candidate / "SHA256SUMS").read_text() == expected_sums, "SHA256SUMS mismatch"
          PY

      - name: Create immutable GitHub Release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TAG_EXISTS: ${{ needs.build.outputs.tag_exists }}
          CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 严禁覆盖已存在的 GitHub Release。
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; overwriting published versions is forbidden." >&2
            exit 1
          fi

          RELEASE_ARGS=(
            "$VERSION"
            --repo "$GITHUB_REPOSITORY"
            --title "$VERSION"
            --generate-notes
          )
          if [ "$TAG_EXISTS" = "true" ]; then
            RELEASE_ARGS+=(--verify-tag)
          else
            RELEASE_ARGS+=(--target "$COMMIT")
          fi

          # 发布阶段直接上传已验证的候选制品，不重新编译。
          RELEASE_URL="$(gh release create "${RELEASE_ARGS[@]}" \
            "${CANDIDATE_DIR}/antapi_${VERSION}_darwin_amd64.tar.gz" \
            "${CANDIDATE_DIR}/antapi_${VERSION}_darwin_arm64.tar.gz" \
            "${CANDIDATE_DIR}/antapi_${VERSION}_linux_amd64.tar.gz" \
            "${CANDIDATE_DIR}/antapi_${VERSION}_linux_arm64.tar.gz" \
            "${CANDIDATE_DIR}/antapi_${VERSION}_windows_amd64.zip" \
            "${CANDIDATE_DIR}/SHA256SUMS" \
            "${CANDIDATE_DIR}/manifest.json")"

          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/manifest.json"
          SUMS_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/SHA256SUMS"

          {
            echo "## AntAPI CLI ${VERSION}"
            echo ""
            echo "- Release: ${RELEASE_URL}"
            echo "- Commit: \`${COMMIT}\`"
            echo "- Manifest: ${MANIFEST_URL}"
            echo "- Checksums: ${SUMS_URL}"
            echo ""
            echo "### SHA256SUMS"
            echo '```text'
            cat "${CANDIDATE_DIR}/SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify antapi repository to sync CLI release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          SUPPORTED_APIS: ${{ needs.build.outputs.supported_apis }}
          ANTAPI_SYNC_TOKEN: ${{ secrets.ANTAPI_SYNC_TOKEN }}
          TARGET_REPO: xiaopozhu/antapi
        run: |
          set -euo pipefail
          if [ -z "$ANTAPI_SYNC_TOKEN" ]; then
            echo "ANTAPI_SYNC_TOKEN secret is not configured; skipping automatic sync dispatch to ${TARGET_REPO}."
            exit 0
          fi
          PAYLOAD="$(python3 - "$VERSION" "$COMMIT" "$SUPPORTED_APIS" <<'PY'
          import json
          import sys

          version, commit, supported_apis_raw = sys.argv[1:4]
          print(json.dumps({
              "event_type": "cli-release-published",
              "client_payload": {
                  "version": version,
                  "commit": commit,
                  "supported_apis": json.loads(supported_apis_raw),
              },
          }, separators=(",", ":")))
          PY
          )"
          GH_TOKEN="$ANTAPI_SYNC_TOKEN" gh api \
            --method POST \
            "repos/${TARGET_REPO}/dispatches" \
            --input - <<<"$PAYLOAD"
          echo "Dispatched cli-release-published (${VERSION}) to ${TARGET_REPO}."
